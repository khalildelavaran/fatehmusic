name: Dependency security remediation

on:
  push:
    branches:
      - security/dependency-audit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply dependency security updates
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set 'dependencies.astro=^7.3.4'
          npm pkg set 'dependencies.@astrojs/cloudflare=^14.3.3'
          npm pkg set 'devDependencies.miniflare=^5.20260925.0-alpha'
          npm pkg set 'devDependencies.vitest=^4.1.11'
          npm pkg set 'devDependencies.wrangler=^4.141.0'
          npm pkg delete 'overrides.undici'
          npm install --package-lock-only
          npm audit fix --package-lock-only

      - name: Verify npm audit
        run: npm audit --audit-level=high

      - name: Verify project
        run: |
          npm run check
          npm test
          npm run build
          npm run seo:audit

      - name: Commit remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "fix: remediate npm dependency vulnerabilities"
          git push origin HEAD:security/dependency-audit
