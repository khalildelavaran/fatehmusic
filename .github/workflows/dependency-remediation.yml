name: Dependency remediation

on:
  push:
    branches:
      - security/dependency-remediation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update direct dependencies
        run: |
          set -euo pipefail
          npx --yes npm@11.20.0 install --package-lock-only --ignore-scripts --no-audit --no-fund             astro@7.3.4             @astrojs/cloudflare@14.3.3             miniflare@5.20260925.0-alpha             vitest@4.1.11             wrangler@4.141.0

      - name: Show dependency state
        run: |
          npm ls astro @astrojs/cloudflare miniflare vitest wrangler --depth=0
          npm audit --json > audit.json || true
          node -e 'const a=require("./audit.json"); console.log(JSON.stringify(a.metadata?.vulnerabilities || {}, null, 2))'

      - name: Commit dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --stat
          git commit -m "fix: update vulnerable dependencies"
          git push origin HEAD:security/dependency-remediation
