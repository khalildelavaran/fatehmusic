name: Lighthouse SEO & Performance Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "45 3 * * 1"

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path: [/, /courses, /about, /blog]
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Lighthouse
        run: |
          mkdir -p lighthouse
          npx --yes lighthouse "https://fatehmusic.ir${{ matrix.path }}" \
            --output=html \
            --output=json \
            --output-path="./lighthouse/report" \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --only-categories="performance,accessibility,best-practices,seo"

      - name: Verify Lighthouse reports
        run: |
          test -s "lighthouse/report.report.html"
          test -s "lighthouse/report.report.json"

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ github.run_id }}-${{ strategy.job-index }}
          path: lighthouse/
          if-no-files-found: error