name: Cleanup daily finance tabs
on:
  push:
    paths:
      - ".github/workflows/cleanup-daily-finance-tabs.yml"
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove finance context tabs from daily dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/pages/admin/daily.astro")
          s = p.read_text(encoding="utf-8")
          start = s.find('        <nav class="finance-context-tabs"')
          if start != -1:
              end = s.find('        </nav>\n', start)
              if end != -1:
                  s = s[:start] + s[end + len('        </nav>\n'):]
          css_start = s.find('.finance-context-tabs{')
          if css_start != -1:
              css_end = s.find('.daily-topbar{', css_start)
              if css_end != -1:
                  s = s[:css_start] + s[css_end:]
          p.write_text(s, encoding="utf-8")
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/daily.astro
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor(finance): move financial tabs to finance center"
          git push
