name: Live SEO Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The live audit uses only Node.js built-ins; installing dependencies
      # is unnecessary. Avoid npm lockfile/cache assumptions in this workflow.
      - name: Run production SEO audit
        env:
          SEO_SITE_URL: https://fatehmusic.ir
        run: node scripts/seo-http-audit.mjs
