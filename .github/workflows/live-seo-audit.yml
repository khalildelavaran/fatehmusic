name: Live SEO Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production SEO audit
        env:
          SEO_SITE_URL: https://fatehmusic.ir
        run: npm run seo:live-audit
