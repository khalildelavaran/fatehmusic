name: Operational Domain CI

on:
  push:
    branches:
      - chore/operational-domain-reconciliation
      - feat/operational-class-scheduling
  pull_request:
    paths:
      - 'migrations/**'
      - 'src/server/**'
      - 'src/pages/api/admin/**'
      - 'src/pages/admin/daily.astro'
      - 'src/scripts/admin/class-profile.js'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Astro and TypeScript check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Apply full D1 migration chain to local database
        run: npm run db:migrate:local

      - name: Inspect operational schema smoke queries
        run: |
          npx wrangler d1 execute fatehmusic-db --local --file=tests/operational-domain-schema.test.sql
          npx wrangler d1 execute fatehmusic-db --local --file=tests/operational-domain-integrity.test.sql
